# Distribution kernel configurations, pinned. Each file is the config the distribution ships in
# its kernel package, unchanged, for a version that is also a pin in pins.toml, so that
# `rk build <version> --config <name>` builds what the distribution builds, with our compiler.
#
# The overrides are laid over the file before olddefconfig. They only point the signing and
# key settings at what a plain tree has: a module signing key kbuild makes on the spot, and no
# distribution certificates, which are not in the tarball.
#
# To refresh a pin, fetch the package inside the distribution's container image, take the config
# out of it, and record both hashes here:
#
#   docker run --rm -v "$PWD:/out" debian:13 sh -c 'apt-get update && cd /out && apt-get download linux-image-6.12.111+deb13-amd64'
#   docker run --rm -v "$PWD:/out" fedora:44 sh -c 'cd /out && dnf download kernel-core-7.2.8-200.fc44'

[[distro]]
name = "debian-13"
file = "debian-13-amd64.config"
version = "6.12.111"
row = "X64"
package = "linux-image-6.12.111+deb13-amd64_6.12.111-1_amd64.deb"
package_sha256 = "792e7a407f8f39fa0db3deeb6cda4e4bb56042963376133a072856b1c685d4f3"
config_sha256 = "7264f6c17e856bf18ec53085a01be10d8e466f32a8dcb13c08c4e705d3b2c35b"
compiler = "gcc 14.2.0"
overrides = [
  'CONFIG_SYSTEM_TRUSTED_KEYS=""',
  'CONFIG_SYSTEM_REVOCATION_KEYS=""',
  'CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"',
]

[[distro]]
name = "fedora-44"
file = "fedora-44-x86_64.config"
version = "7.2.8"
row = "X64"
package = "kernel-core-7.2.8-200.fc44.x86_64.rpm"
package_sha256 = "b86953a9b3311aceeadb668bfa26aa8134af0d4a55dc5bae068bda1d0acf5c1f"
config_sha256 = "de2947fbecd9addbf0612ba44a963e082bb34a35a552184b10a00e62690756f8"
compiler = "gcc 16.2.1"
overrides = [
  'CONFIG_SYSTEM_TRUSTED_KEYS=""',
  'CONFIG_SYSTEM_REVOCATION_KEYS=""',
  'CONFIG_MODULE_SIG_KEY="certs/signing_key.pem"',
]

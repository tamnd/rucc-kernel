# Differences between the reference's .config and rucc's that are expected, and why.
#
# rk config-diff reads this file. A difference that is not listed here is a finding: either rucc
# answers a Kconfig probe differently from the reference and has work to do, or the difference is
# fine and belongs here with a reason. A trailing star in a symbol matches every symbol with that
# prefix. Every entry must say why, and name the rucc issue that removes it when there is one.
#
# rk flags-diff reads the [[flags]] entries the same way, with flag = "..." instead of symbol, for
# flags one build passes to its units and the other does not. The list starts empty.

[[divergence]]
symbol = "CC_VERSION_TEXT"
reason = "the first line of --version, which names the compiler and so always differs"

[[divergence]]
symbol = "CC_HAS_KASAN_*"
reason = "rucc has no -fsanitize=kernel-address or kernel-hwaddress, and plan section 8.10 keeps the sanitizers out of the grade, with KASAN off in both builds"

[[divergence]]
symbol = "KASAN"
reason = "only visible when the compiler can build it, see CC_HAS_KASAN_*"

[[divergence]]
symbol = "HAVE_KCSAN_COMPILER"
reason = "rucc has no -fsanitize=thread, and plan section 8.10 keeps the sanitizers out of the grade, with KCSAN off in both builds"

[[divergence]]
symbol = "KCSAN"
reason = "only visible when the compiler can build it, see HAVE_KCSAN_COMPILER"

[[divergence]]
symbol = "CC_HAS_SANCOV_TRACE_PC"
reason = "rucc has no -fsanitize-coverage=trace-pc, and plan section 8.10 keeps KCOV out of the grade, with KCOV off in both builds. 7.2.8 no longer asks"

[[divergence]]
symbol = "KCOV"
reason = "only visible when the compiler can build it, see CC_HAS_SANCOV_TRACE_PC"

[[divergence]]
symbol = "GCC_VERSION"
reason = "rucc claims the GCC of the era in personas.toml, 12.2.0 for 6.12 and 6.1, while the reference on the CI runner is Ubuntu 24.04's gcc-12, which is 12.3.0. The two differ only in the patch level, and both are before the 12.4 fix for asm goto outputs, so GCC_ASM_GOTO_OUTPUT_BROKEN agrees"

[[divergence]]
symbol = "AS_VERSION"
reason = "rucc answers -Wa,--version with the binutils of the era in personas.toml, which is 2.44 for 7.2 and 2.40 for 6.12 and 6.1, while the reference on the CI runner is Ubuntu 24.04's binutils 2.42. No other symbol differs because of it, since every assembler feature test runs the assembler itself"

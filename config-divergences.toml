# Differences between the reference's .config and rucc's that are expected, and why.
#
# rk config-diff reads this file. A difference that is not listed here is a finding: either rucc
# answers a Kconfig probe differently from the reference and has work to do, or the difference is
# fine and belongs here with a reason. A trailing star in a symbol matches every symbol with that
# prefix. Every entry must say why, and name the rucc issue that removes it when there is one.
#
# rk flags-diff reads the [[flags]] entries the same way, with flag = "..." instead of symbol, for
# flags one build passes to its units and the other does not. The list starts empty.

[[divergence]]
symbol = "CC_VERSION_TEXT"
reason = "the first line of --version, which names the compiler and so always differs"

[[divergence]]
symbol = "CC_HAS_KASAN_*"
reason = "rucc has no -fsanitize=kernel-address or kernel-hwaddress, and plan section 8.10 keeps the sanitizers out of the grade, with KASAN off in both builds"

[[divergence]]
symbol = "KASAN*"
reason = "KASAN itself and its generic and software tag modes are only visible when the compiler can build them, see CC_HAS_KASAN_*. On arm64 allmodconfig still turns KASAN on in the rucc build, since the hardware tag mode needs no compiler support, so the gcc build has KASAN_GENERIC with KASAN_INLINE, KASAN_STACK and the shadow offset, and the rucc build has KASAN_HW_TAGS"

[[divergence]]
symbol = "CC_HAS_UBSAN_*"
reason = "rucc has no -fsanitize=bounds-strict or any other UBSAN check, and plan section 8.10 keeps the sanitizers out of the grade. allmodconfig turns UBSAN on in both builds, and in the rucc build it has no checks under it"

[[divergence]]
symbol = "UBSAN_*"
reason = "the UBSAN checks allmodconfig asks for, each of which Kconfig only offers when the compiler takes its -fsanitize= flag, see CC_HAS_UBSAN_*"

[[divergence]]
symbol = "CC_HAVE_SHADOW_CALL_STACK"
reason = "rucc has no -fsanitize=shadow-call-stack, and plan section 8.10 keeps the shadow call stack out of the grade with the sanitizers. Only allmodconfig on arm64 asks for it"

[[divergence]]
symbol = "ARCH_SUPPORTS_SHADOW_CALL_STACK"
reason = "arm64 selects it only when the compiler has the shadow call stack, see CC_HAVE_SHADOW_CALL_STACK"

[[divergence]]
symbol = "SHADOW_CALL_STACK"
reason = "only visible when the architecture supports it, see CC_HAVE_SHADOW_CALL_STACK"

[[divergence]]
symbol = "AS_HAS_LSUI"
reason = "7.2 asks the assembler for .arch_extension lsui, which binutils has since 2.45. Ubuntu 24.04's binutils 2.42 says no and rucc's assembler says yes. The kernel uses ldtadd, ldtset, ldtclr and swpt with acquire and release in the futex code and cast and casalt in KVM, and rucc encodes the 13 forms of those tried the same as llvm-mc 23. The code only runs on a CPU with FEAT_LSUI, behind an alternative"

[[divergence]]
symbol = "ARM64_LSUI"
reason = "default y once the assembler has LSUI, see AS_HAS_LSUI"

[[divergence]]
symbol = "RUSTC_VERSION"
reason = "the runner's rustc, not the C compiler. The census builds each compiler in its own job, and when the runner image moves on between them the two get different patch releases, as with 1.99.0 and 1.99.1 for the 7.2.8 and 6.12.111 A64 allmodconfig builds. Rust is off in both builds"

[[divergence]]
symbol = "HAVE_KCSAN_COMPILER"
reason = "rucc has no -fsanitize=thread, and plan section 8.10 keeps the sanitizers out of the grade, with KCSAN off in both builds"

[[divergence]]
symbol = "KCSAN"
reason = "only visible when the compiler can build it, see HAVE_KCSAN_COMPILER"

[[divergence]]
symbol = "CC_HAS_SANCOV_TRACE_PC"
reason = "rucc has no -fsanitize-coverage=trace-pc, and plan section 8.10 keeps KCOV out of the grade, with KCOV off in both builds. 7.2.8 no longer asks"

[[divergence]]
symbol = "KCOV"
reason = "only visible when the compiler can build it, see CC_HAS_SANCOV_TRACE_PC"

[[divergence]]
symbol = "GCC_VERSION"
reason = "rucc claims the GCC of the era in personas.toml, 12.2.0 for 6.12 and 6.1, while the reference on the CI runner is Ubuntu 24.04's gcc-12, which is 12.3.0. The two differ only in the patch level, and both are before the 12.4 fix for asm goto outputs, so GCC_ASM_GOTO_OUTPUT_BROKEN agrees"

[[divergence]]
symbol = "AS_VERSION"
reason = "rucc answers -Wa,--version with the binutils of the era in personas.toml, which is 2.44 for 7.2 and 2.40 for 6.12 and 6.1, while the reference on the CI runner is Ubuntu 24.04's binutils 2.42. No other symbol differs because of it, since every assembler feature test runs the assembler itself"

[[divergence]]
symbol = "CC_CAN_LINK"
reason = "The build host decides this, not the compiler. On X32 Kconfig asks if $(CC) -m32 links a program. The reference gcc on server2 and on the CI runner has no 32-bit multilib, so it says no, while rucc finds the i686 cross libc and says yes. Only the user-space test programs depend on it, and no other symbol changes"

[[divergence]]
symbol = "CC_CAN_LINK_STATIC"
reason = "The same as CC_CAN_LINK, one level stricter. On X32 in 6.1 Kconfig asks if $(CC) -m32 -static links a program. The reference gcc has no 32-bit multilib and says no, while rucc finds the static i686 cross libc and says yes. Only the user-space test programs depend on it"

[[divergence]]
symbol = "GCC_ASM_GOTO_OUTPUT_WORKAROUND"
reason = "This follows GCC_VERSION. In 6.1 it is y for gcc 12.0 to 12.3, which have bug 113921 in asm goto with outputs, and it adds an empty asm volatile after each asm goto. rucc claims 12.2.0 for 6.1 and gets it, and so does the CI reference gcc-12 at 12.3.0. A reference gcc-13 at 13.3, as on server2, has the fix and does not. The extra empty asm emits no code"

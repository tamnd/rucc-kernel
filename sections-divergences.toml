# Sections that come from the reference compiler's defaults and not from the kernel's flags.

[[divergence]]
what = "sections"
object = "arch/x86/boot/compressed/*"
only = "reference"
item = ".note.gnu.property"
reason = "Ubuntu's gcc turns on -fcf-protection when no -fcf-protection is given, and writes the IBT and SHSTK property note. The decompressor sets its own flags with no -fcf-protection. Debian's gcc and rucc write no note then"

[[divergence]]
what = "sections"
object = "drivers/firmware/efi/libstub/*"
only = "reference"
item = ".note.gnu.property"
reason = "the same Ubuntu gcc default as in the decompressor. The EFI stub Makefile removes the note from each stub object with --remove-section=.note.gnu.property"

[[divergence]]
what = "sections"
only = "reference"
item = ".text.startup"
reason = "gcc puts a function named main in .text.startup when it optimizes. The kernel has main in arch/x86/boot/main.c and in the realmode wakemain.c, and setup.ld and realmode.lds.S both collect .text.*"


# The fortify field spanning WARN that gcc 12 keeps and gcc 14 and rucc do not, on 6.12 arm64,
# where the reference is gcc 12. For a pointer into a kmalloc'd object whose size is only known at
# run time, gcc 12's __builtin_dynamic_object_size works out the bytes left in the allocation for
# type 1 but gives up for type 0. So p_size is SIZE_MAX, p_size != p_size_field holds, and the test
# of p_size_field against the copy stays. rucc and gcc 14 get the same size for both types, the WARN
# folds away and the fortify panic test on p_size stays. This was traced in wl1251_cmd_template_set
# and mana_cfg_vport_steering, and each unit below was compiled with gcc 12.4, gcc 14.2 and rucc to
# check that gcc 14 drops the WARN as well.


# The era containers of plan 4.4, one per Debian release that an era in personas.toml names.
#
# Each is built from provision/eras/<release>/Dockerfile by the provision workflow and pushed to
# the GitHub container registry. The digest is filled in from the workflow's summary after the
# push, and a graded build uses the image by digest so that it can be repeated. An empty digest
# means the latest tag, which rk personas check accepts but reports.

[[container]]
name = "rk-era-etch"
image = "ghcr.io/tamnd/rucc-kernel/rk-era-etch"
digest = "sha256:f861459d790c0dce1e93c523dca7aaff7082ab564e587840f7c0b18202d7fae8"


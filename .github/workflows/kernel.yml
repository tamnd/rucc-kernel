# Kernel builds: the default pin on X64 with the test fragment, with the reference and with the
# pinned rucc release, each through rk-cc so that every compiler call lands in compile.jsonl, and
# then a boot of whatever built.
#
# The reference job must pass. The rucc job is allowed to fail until K2, when every defconfig unit
# is meant to compile, and its summary and artifacts are what the demand census starts from.
#
# Each build job also reduces its objects to the small JSON files rk sections-diff and rk vec-audit
# save, and audits its modules, so that the compare job can put the object level diffs of K2 in
# its summary without carrying the objects between jobs. None of these fail a job yet. The builds
# pass -fstack-usage, which changes no code, so that rk frames can compare every function's frame.
#
# The rucc binary is the release tarball, checked against the hash written here, not a build from
# source, so that a result names exactly one compiler. A manual run can name a branch or commit of
# tamnd/rucc instead, which is built from source and named by its commit in the step summary, so
# that work merged since the last release can be tried against a kernel before it is released.

name: kernel

on:
  pull_request:
    paths:
      - crates/**
      - Cargo.lock
      - pins.toml
      - personas.toml
      - rows.toml
      - .github/workflows/kernel.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: A pinned version, or empty for the default pin
        required: false
        default: ""
      rucc:
        description: A branch or commit of tamnd/rucc to build instead of the pinned release
        required: false
        default: ""

# A manual run is its own group, so that a push to main queued behind it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RK_CACHE: ${{ github.workspace }}/../rk-cache
  RUCC_VERSION: v0.17.0
  RUCC_SHA256: fcf451c3193ddd0f83f13c7f0a1e27c3cedec0f648af08ca7bd83dbdfbdffbb5

jobs:
  build:
    name: ${{ matrix.config }} with ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.cc == 'rucc' }}
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, rucc]
        config: [tinyconfig, defconfig]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: kernel build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends gcc-14 flex bison bc libelf-dev libssl-dev \
            cpio qemu-system-x86 busybox-static
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: rucc ${{ inputs.rucc || env.RUCC_VERSION }} from source
        if: inputs.rucc != ''
        run: |
          git clone -q https://github.com/tamnd/rucc "$RUNNER_TEMP/rucc-src"
          git -C "$RUNNER_TEMP/rucc-src" checkout -q "$REF"
          cargo build --release --manifest-path "$RUNNER_TEMP/rucc-src/Cargo.toml" -p rucc
          echo "$RUNNER_TEMP/rucc-src/target/release" >> "$GITHUB_PATH"
          echo "rucc built from $(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF: ${{ inputs.rucc }}
      - name: rucc ${{ env.RUCC_VERSION }}
        if: inputs.rucc == ''
        run: |
          name="rucc-$RUCC_VERSION-x86_64-unknown-linux-gnu"
          gh release download "$RUCC_VERSION" -R tamnd/rucc -p "$name.tar.gz" -D "$RUNNER_TEMP"
          echo "$RUCC_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build rk
        run: cargo build --release --workspace
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.RK_CACHE }}/archives
          key: kernel-archives-${{ hashFiles('pins.toml') }}
          restore-keys: kernel-archives-
      - name: rk build
        run: |
          target/release/rk build ${{ inputs.version }} --row X64 --config ${{ matrix.config }} \
            --fragment test --cc ${{ matrix.cc }} --out "$RUNNER_TEMP/out" --keep-going --stack-usage
      - name: rk boot
        run: target/release/rk boot --build "$RUNNER_TEMP/out" --timeout 600
      - name: rk asm-inventory
        if: matrix.cc == 'gcc-14'
        run: target/release/rk asm-inventory --build "$RUNNER_TEMP/out"
      - name: rk syntax
        if: matrix.cc == 'gcc-14'
        run: |
          target/release/rk syntax --build "$RUNNER_TEMP/out" --cc rucc > "$RUNNER_TEMP/out/syntax.md" || true
          cat "$RUNNER_TEMP/out/syntax.md" >> "$GITHUB_STEP_SUMMARY"
      - name: rk object audits
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          target/release/rk sections-diff --reference "$out" --save "$out/sections.json" || true
          target/release/rk vec-audit --build "$out" --save "$out/vec.json" > "$out/vec-audit.md" || true
          target/release/rk modules-audit --build "$out" > "$out/modules-audit.md" || true
          target/release/rk frames --reference "$out" --save "$out/frames.json" || true
          cat "$out/vec-audit.md" "$out/modules-audit.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: keep the record
        if: always()
        run: |
          mkdir -p record
          cd "$RUNNER_TEMP/out"
          cp build.json summary.md config.log fragment.log build.log boot.json boot.log asm-inventory.md syntax.md .config \
            sections.json vec.json frames.json vec-audit.md modules-audit.md Module.symvers System.map \
            "$GITHUB_WORKSPACE/record/" 2>/dev/null || true
          if [ -f compile.jsonl ]; then gzip -c compile.jsonl > "$GITHUB_WORKSPACE/record/compile.jsonl.gz"; fi
          find . -path ./rk-bin -prune -o -name '.*.o.cmd' -print | tar -czf "$GITHUB_WORKSPACE/record/cmd.tar.gz" -T -
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: X64-${{ matrix.config }}-${{ matrix.cc }}
          path: record
          include-hidden-files: true
          retention-days: 30

  compare:
    name: ${{ matrix.config }}, rucc against gcc-14
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config: [tinyconfig, defconfig]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: X64-${{ matrix.config }}-*
          path: records
      - name: build rk
        run: |
          cargo build --release -p rk
          gunzip -f records/*/compile.jsonl.gz
          for r in records/*; do if [ -f "$r/cmd.tar.gz" ]; then tar -xzf "$r/cmd.tar.gz" -C "$r"; fi; done
      - name: rk config-diff
        run: |
          target/release/rk config-diff --reference records/X64-${{ matrix.config }}-gcc-14 \
            --other records/X64-${{ matrix.config }}-rucc | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk probes
        if: always()
        run: |
          target/release/rk probes --reference records/X64-${{ matrix.config }}-gcc-14 \
            --other records/X64-${{ matrix.config }}-rucc | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk flags-diff
        if: always()
        run: |
          target/release/rk flags-diff --reference records/X64-${{ matrix.config }}-gcc-14 \
            --other records/X64-${{ matrix.config }}-rucc | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk sections-diff
        if: always()
        run: |
          target/release/rk sections-diff --reference records/X64-${{ matrix.config }}-gcc-14/sections.json \
            --other records/X64-${{ matrix.config }}-rucc/sections.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk symvers-diff
        if: always()
        run: |
          target/release/rk symvers-diff --reference records/X64-${{ matrix.config }}-gcc-14 \
            --other records/X64-${{ matrix.config }}-rucc | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk vec-audit
        if: always()
        run: |
          target/release/rk vec-audit --build records/X64-${{ matrix.config }}-rucc/vec.json \
            --reference records/X64-${{ matrix.config }}-gcc-14/vec.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk objtool-report
        if: always()
        run: |
          target/release/rk objtool-report --reference records/X64-${{ matrix.config }}-gcc-14 \
            --other records/X64-${{ matrix.config }}-rucc | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk frames
        if: always()
        run: |
          target/release/rk frames --reference records/X64-${{ matrix.config }}-gcc-14/frames.json \
            --other records/X64-${{ matrix.config }}-rucc/frames.json | tee -a "$GITHUB_STEP_SUMMARY"

  demands:
    name: the demand census
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: X64-*-rucc
          path: records
      - name: rk demands
        run: |
          cargo build --release -p rk
          gunzip -f records/*/compile.jsonl.gz
          target/release/rk demands --builds "$(echo records/*)" | tee -a "$GITHUB_STEP_SUMMARY"

# Scratch: the userspace maple tree harness, gcc and rucc builds, timed on a hosted runner.
name: scratch-mt
on:
  push:
    branches: [k2-scratch-mt]
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: time
        run: |
          grep -m1 'model name' /proc/cpuinfo
          tar xzf scratch/h.tgz
          for r in $(seq 1 15); do
            for k in g r gn rn; do
              for w in B M; do
                s=$(date +%s%N); taskset -c 1 ./$k/bench 1000000 $w > /dev/null 2>&1; e=$(date +%s%N)
                echo "$k $w $(( (e - s) / 1000 ))" >> t.txt
              done
            done
          done
          python3 - <<'PY'
          import collections, statistics
          d = collections.defaultdict(list)
          for line in open("t.txt"):
              k, w, us = line.split()
              d[(k, w)].append(int(us))
          for w in "BM":
              for pair in (("g", "r"), ("gn", "rn")):
                  a = statistics.median(d[(pair[0], w)])
                  b = statistics.median(d[(pair[1], w)])
                  print(f"{w} {pair[0]} {a:.0f} {pair[1]} {b:.0f} ratio {b / a:.3f}")
          PY

# Reference baselines: 7.2, 6.12 and 6.1 defconfig with the test fragment, built and booted three
# times with the reference on X64 and A64, on the row's own architecture.
#
# The result files are uploaded, not committed from here. A person reads them and commits them to
# results/baseline in a pull request, so that a baseline never changes without a review. The A64
# job also says whether the arm runners have KVM, which is open question 8 of the plan.
#
# A manual run can name other versions and another config, such as the rest of the current set or
# debian-13-arm64 on 6.12.111, which is how the A64 baselines cover the whole set.
#
# X32 is run by asking for it. An i386 kernel cannot run the runner's x86-64 busybox, so that row
# boots a static i686 busybox from busybox.net, checked against the hash written here.
#
# R64 is run by asking for it too. It builds on the x86-64 runner with Ubuntu's gcc-14 cross
# compiler, boots under TCG with the OpenSBI that Ubuntu ships, and boots Debian's static riscv64
# busybox, checked against the hash written here.

name: baseline

on:
  workflow_dispatch:
    inputs:
      rows:
        description: The rows to run, as a JSON list
        required: false
        default: '["X64", "A64"]'
      versions:
        description: The versions to run, as a JSON list
        required: false
        default: '["7.2.8", "6.12.111", "6.1.188"]'
      config:
        description: The base config, defconfig or a pinned distribution config
        required: false
        default: defconfig
  schedule:
    - cron: "41 2 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RK_CACHE: ${{ github.workspace }}/../rk-cache
  BUSYBOX_I686: https://busybox.net/downloads/binaries/1.35.0-i686-linux-musl/busybox
  BUSYBOX_I686_SHA256: 27e409705b29937b9a6105038d9c2e3eb8dc3e2c8d606d22872dbde7f47c000f
  BUSYBOX_RISCV64: https://deb.debian.org/debian/pool/main/b/busybox/busybox-static_1.37.0-6+b9_riscv64.deb
  BUSYBOX_RISCV64_SHA256: 4add476d2b185c5b487c285b38d790f0881a7e4a8e2ddde835f917e770eb8633

jobs:
  baseline:
    name: ${{ matrix.version }} ${{ matrix.row }}
    runs-on: ${{ matrix.row == 'A64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions || '["7.2.8", "6.12.111", "6.1.188"]') }}
        row: ${{ fromJSON(inputs.rows || '["X64", "A64"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: kernel build dependencies
        run: |
          sudo apt-get update -q
          case "${{ matrix.row }}" in
            A64) machine="qemu-system-arm" ;;
            R64) machine="qemu-system-misc opensbi gcc-14-riscv64-linux-gnu" ;;
            *) machine="qemu-system-x86" ;;
          esac
          sudo apt-get install -qy --no-install-recommends gcc-14 flex bison bc libelf-dev libssl-dev \
            cpio $machine busybox-static
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then echo "KVM: yes" >> "$GITHUB_STEP_SUMMARY"; else echo "KVM: no" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: a 32-bit busybox
        if: matrix.row == 'X32'
        run: |
          curl -sfL -o "$RUNNER_TEMP/busybox" "$BUSYBOX_I686"
          echo "$BUSYBOX_I686_SHA256  $RUNNER_TEMP/busybox" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/busybox"
          echo "BUSYBOX=$RUNNER_TEMP/busybox" >> "$GITHUB_ENV"
      - name: a riscv64 busybox
        if: matrix.row == 'R64'
        run: |
          curl -sfL -o "$RUNNER_TEMP/busybox.deb" "$BUSYBOX_RISCV64"
          echo "$BUSYBOX_RISCV64_SHA256  $RUNNER_TEMP/busybox.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/busybox.deb" "$RUNNER_TEMP/bbrv"
          echo "BUSYBOX=$RUNNER_TEMP/bbrv/usr/bin/busybox" >> "$GITHUB_ENV"
      - name: build rk
        run: cargo build --release --workspace
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.RK_CACHE }}/archives
          key: kernel-archives-${{ matrix.version }}-${{ hashFiles('pins.toml') }}
          restore-keys: kernel-archives-${{ matrix.version }}-
      - name: rk baseline
        run: |
          target/release/rk baseline ${{ matrix.version }} --row ${{ matrix.row }} --config "$CONFIG" \
            --fragment test --cc "$CC" --runs 3 --busybox "${BUSYBOX:-/bin/busybox}"
        env:
          CONFIG: ${{ inputs.config || 'defconfig' }}
          CC: ${{ matrix.row == 'R64' && 'riscv64-linux-gnu-gcc-14' || 'gcc-14' }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: baseline-${{ matrix.version }}-${{ matrix.row }}
          path: |
            results/baseline
            work/*/run*/boot.log
          retention-days: 90

# rk mixed on a failure put there on purpose, to show it finds one end to end, or on a real one.
#
# By default the rucc kernel is built with -fenable-inject-fault=<function>, which flips the low
# bit of every integer that function stores. The default is time64_to_tm, which only the KUnit case
# below checks, so the kernel boots and that one case fails. rk mixed then has to find the object,
# the fuel step, the pass and the function on its own, and the job fails unless the summary names
# the inject-fault pass and the function. It needs a rucc with the pass, which every release from
# 0.24.3 on has. With the function left empty nothing is injected, and the row, config and targets
# pick the kernel a real failure was seen in, such as A64 defconfig with the image only and the
# boot unit.

name: mixed

on:
  workflow_dispatch:
    inputs:
      version:
        description: The kernel version
        required: false
        default: 7.2.8
      function:
        description: The function to inject the fault into, or empty for none
        required: false
        default: time64_to_tm
      row:
        description: The row
        required: false
        default: X64
      config:
        description: The base config
        required: false
        default: tinyconfig
      targets:
        description: The make targets, or empty for the row's image
        required: false
        default: bzImage modules
      unit:
        description: The unit the fault makes fail
        required: false
        default: kunit:time_test_cases.time64_to_tm_test_date_range
      rucc:
        description: A branch, tag or commit of tamnd/rucc to build
        required: false
        default: v0.24.8

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RK_CACHE: ${{ github.workspace }}/../rk-cache

jobs:
  mixed:
    name: ${{ inputs.version }} ${{ inputs.row }} ${{ inputs.config }}, ${{ inputs.function || inputs.unit }}
    runs-on: ${{ inputs.row == 'A64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: kernel build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends gcc-14 flex bison bc libelf-dev libssl-dev \
            cpio busybox-static "$([ "$ROW" = A64 ] && echo qemu-system-arm || echo qemu-system-x86)"
        env:
          ROW: ${{ inputs.row }}
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: rucc ${{ inputs.rucc }} from source
        run: |
          git clone -q https://github.com/tamnd/rucc "$RUNNER_TEMP/rucc-src"
          git -C "$RUNNER_TEMP/rucc-src" checkout -q "$REF"
          cargo build --release --manifest-path "$RUNNER_TEMP/rucc-src/Cargo.toml" -p rucc
          echo "$RUNNER_TEMP/rucc-src/target/release" >> "$GITHUB_PATH"
          echo "rucc built from $(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF: ${{ inputs.rucc }}
      - name: build rk
        run: cargo build --release --workspace
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.RK_CACHE }}/archives
          key: kernel-archives-${{ inputs.version }}-${{ hashFiles('pins.toml') }}
          restore-keys: kernel-archives-${{ inputs.version }}-
      - name: rk build with gcc-14
        run: |
          target/release/rk build "$VERSION" --row "$ROW" --config "$CONFIG" --fragment test \
            --cc gcc-14 ${TARGETS:+--targets "$TARGETS"} --out "$RUNNER_TEMP/gcc"
        env:
          VERSION: ${{ inputs.version }}
          ROW: ${{ inputs.row }}
          CONFIG: ${{ inputs.config }}
          TARGETS: ${{ inputs.targets }}
      - name: rk build with rucc
        run: |
          target/release/rk build "$VERSION" --row "$ROW" --config "$CONFIG" --fragment test \
            --cc rucc ${TARGETS:+--targets "$TARGETS"} --out "$RUNNER_TEMP/rucc" --keep-going \
            ${FUNCTION:+--kcflags "-fenable-inject-fault=$FUNCTION"}
        env:
          VERSION: ${{ inputs.version }}
          ROW: ${{ inputs.row }}
          CONFIG: ${{ inputs.config }}
          TARGETS: ${{ inputs.targets }}
          FUNCTION: ${{ inputs.function }}
      - name: rk test
        id: test
        continue-on-error: true
        run: |
          target/release/rk test --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            --row "$ROW" --kinds boot,smoke,kunit --out "$RUNNER_TEMP/test"
        env:
          ROW: ${{ inputs.row }}
      - name: the unit fails
        run: |
          python3 - "$RUNNER_TEMP/test/test.json" "$UNIT" <<'EOF'
          import json, sys
          t = json.load(open(sys.argv[1]))
          failed = [u["name"] for u in t["units"] if u["graded"] and not u["passed"]]
          print("failed:", ", ".join(failed) or "nothing")
          sys.exit(0 if sys.argv[2] in failed else f"{sys.argv[2]} did not fail, so there is nothing to find")
          EOF
        env:
          UNIT: ${{ inputs.unit }}
      - name: rk mixed
        run: |
          target/release/rk mixed --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            --row "$ROW" --unit "$UNIT" --timeout 900 --out "$RUNNER_TEMP/mixed"
        env:
          ROW: ${{ inputs.row }}
          UNIT: ${{ inputs.unit }}
      - name: the summary names the pass and the function
        if: always()
        run: |
          summary="$RUNNER_TEMP/mixed/summary.md"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$FUNCTION" ] || exit 0
          grep -q '`inject-fault`' "$summary"
          grep -q "\`$FUNCTION\`" "$summary"
        env:
          FUNCTION: ${{ inputs.function }}
      - name: keep the record
        if: always()
        run: |
          mkdir -p record/test record/mixed
          cp -r "$RUNNER_TEMP/test/." record/test/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/mixed/{mixed.json,summary.md,relink.jsonl} "$RUNNER_TEMP"/mixed/*.log record/mixed/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/mixed/fuel" record/mixed/ 2>/dev/null || true
          find record/mixed/fuel -name '*.o' -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: mixed-${{ inputs.version }}-${{ inputs.row }}-${{ inputs.config }}
          path: record
          retention-days: 30

# A runner to ask questions of, for the things only a hosted runner can answer, such as which
# hardware counters perf can read on it and whether a guest under KVM can be profiled from the
# host. The script is run as given with bash, on the same kind of runner the nightly uses, after
# /dev/kvm is opened to the runner user and perf is installed.

name: probe

on:
  workflow_dispatch:
    inputs:
      script:
        description: The bash script to run
        required: true
        default: lscpu; perf stat -e cycles,instructions -- sleep 1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: perf
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -yq linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
      - name: script
        env:
          SCRIPT: ${{ inputs.script }}
        run: bash -c "$SCRIPT"

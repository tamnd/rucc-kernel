# The demand census: a kernel built with the GCC of the version's era and with rucc for each row
# and configuration asked for, on the row's own architecture, every unit tried whatever else fails.
# The era's GCC is the one personas.toml names, gcc-14 for 7.2 and gcc-12 for 6.12 and 6.1, as in
# kernel.yml, so that the differentials do not count what the kernel decides by GCC version.
#
# The rucc build ends in rk demands, which counts the units that did not compile by the error that
# stopped them. The gcc build ends in rk asm-inventory, which counts every instruction the kernel
# hands the assembler itself, and in rk syntax, which runs rucc over every unit with the command
# lines gcc was given. The X64 defconfig one also runs the kernel-pp corpus from rucc-compat,
# which preprocesses a sample of the units with rucc and with gcc and compares the text. It is
# given gcc by name, since the runner's cc is gcc-13 and cannot take gcc-14's command lines. The
# tables go to the step summary and the artifacts, and the ones worth keeping go into results/census/ in a
# pull request. allmodconfig is built with the census fragment, which turns DWARF off so the tree
# fits on the runner, and defconfig with the test fragment, as everywhere else. Any other config
# that built its image is then booted with rk boot, and boot.json and boot.log go into the artifact.
#
# Each build also saves its sections, symbols, vector counts and unit command lines and audits its
# modules, and the compare job runs the config, probe, flags, sections, symvers, vec, objtool and speed
# differentials of rucc against gcc. They do not fail the run.
#
# With the reference input set to second, the reference is the era's second reference, GCC 16 for
# E11, and rucc claims it with rk build --persona second. Both builds then run in the era container
# that toolchains.toml names, as in kernel.yml, because no hosted runner has GCC 16. The rk speed
# step of the compare job then gives the compile time of rucc against GCC 16 on runners of one type.

name: census

on:
  workflow_dispatch:
    inputs:
      version:
        description: The kernel version
        required: false
        default: 7.3
      rows:
        description: The rows, as a JSON list
        required: false
        default: '["X64", "A64"]'
      configs:
        description: The base configs, as a JSON list
        required: false
        default: '["defconfig", "allmodconfig"]'
      rucc:
        description: A branch, tag or commit of tamnd/rucc to build
        required: false
        default: v0.30.15
      reference:
        description: The reference, the era's GCC or its second reference built in the era container
        required: false
        default: era
        type: choice
        options: [era, second]
      keep:
        description: Paths in each build tree to keep in the record, such as an object a diff names, separated by spaces
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RK_CACHE: ${{ github.workspace }}/../rk-cache

jobs:
  era:
    name: the reference for the version
    runs-on: ubuntu-24.04
    outputs:
      gcc: ${{ steps.era.outputs.gcc }}
      image: ${{ steps.era.outputs.second-image }}
      ref: ${{ steps.ccs.outputs.ref }}
      other: ${{ steps.ccs.outputs.other }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - id: era
        run: cargo run -q --release -p rk -- personas --for "$VERSION" | tee -a "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
      - id: ccs
        run: |
          if [ "$REFERENCE" = era ]; then
            printf 'ref=%s\nother=rucc\n' "$GCC" | tee -a "$GITHUB_OUTPUT"
          elif [ -n "$SECOND" ]; then
            printf 'ref=%s\nother=rucc-second\n' "$SECOND" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::error::$VERSION has no second reference in personas.toml"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
          REFERENCE: ${{ inputs.reference }}
          GCC: ${{ steps.era.outputs.gcc }}
          SECOND: ${{ steps.era.outputs.second-gcc }}

  census:
    name: ${{ inputs.version }} ${{ matrix.row }} ${{ matrix.config }} with ${{ matrix.cc }}
    needs: era
    runs-on: ${{ matrix.row == 'A64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.rows) }}
        config: ${{ fromJSON(inputs.configs) }}
        cc: ["${{ needs.era.outputs.ref }}", "${{ needs.era.outputs.other }}"]
    env:
      OUT: ${{ github.workspace }}/../${{ matrix.row }}-${{ matrix.config }}-${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: room for the build tree
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: kernel build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends ${GCC:+"$GCC"} flex bison bc libelf-dev libssl-dev
        env:
          GCC: ${{ inputs.reference == 'era' && needs.era.outputs.gcc || '' }}
      - name: rucc ${{ inputs.rucc }} from source
        run: |
          git clone -q https://github.com/tamnd/rucc "$RUNNER_TEMP/rucc-src"
          git -C "$RUNNER_TEMP/rucc-src" checkout -q "$REF"
          cargo build --release --manifest-path "$RUNNER_TEMP/rucc-src/Cargo.toml" -p rucc
          echo "$RUNNER_TEMP/rucc-src/target/release" >> "$GITHUB_PATH"
          echo "rucc built from $(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF: ${{ inputs.rucc }}
      - name: build rk
        run: cargo build --release --workspace
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.RK_CACHE }}/archives
          key: kernel-archives-${{ inputs.version }}-${{ hashFiles('pins.toml') }}
          restore-keys: kernel-archives-${{ inputs.version }}-
      - name: rk build
        if: inputs.reference == 'era'
        continue-on-error: true
        run: |
          target/release/rk build "$VERSION" --row "$ROW" --config "$CONFIG" --fragment "$FRAGMENT" \
            --cc "$CC" --out "$OUT" --keep-going
        env:
          VERSION: ${{ inputs.version }}
          ROW: ${{ matrix.row }}
          CONFIG: ${{ matrix.config }}
          FRAGMENT: ${{ matrix.config == 'allmodconfig' && 'census' || 'test' }}
          CC: ${{ matrix.cc }}
      # The second reference and rucc claiming it build in the era container, so that the host tools
      # Kconfig asks about are the same in both builds.
      - name: rk build in ${{ needs.era.outputs.image }}
        if: inputs.reference == 'second'
        continue-on-error: true
        run: |
          cc=("$CC")
          if [ "$CC" = rucc-second ]; then cc=("$(command -v rucc)" --persona second); fi
          target/release/rk fetch "$VERSION" --no-upstream-check
          work="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e RK_CACHE \
            -v "$work:$work" -w "$GITHUB_WORKSPACE" "$IMAGE" \
            target/release/rk build "$VERSION" --row "$ROW" --config "$CONFIG" --fragment "$FRAGMENT" \
            --cc "${cc[@]}" --out "$OUT" --keep-going --no-upstream-check
        env:
          VERSION: ${{ inputs.version }}
          ROW: ${{ matrix.row }}
          CONFIG: ${{ matrix.config }}
          FRAGMENT: ${{ matrix.config == 'allmodconfig' && 'census' || 'test' }}
          CC: ${{ matrix.cc }}
          IMAGE: ${{ needs.era.outputs.image }}
      - name: rk demands
        if: startsWith(matrix.cc, 'rucc')
        run: |
          target/release/rk demands --builds "$OUT" > "$OUT/demands.md"
          cat "$OUT/demands.md" >> "$GITHUB_STEP_SUMMARY"
      - name: rk asm-inventory
        if: "!startsWith(matrix.cc, 'rucc')"
        run: |
          target/release/rk asm-inventory --build "$OUT"
          head -1 "$OUT/asm-inventory.md" >> "$GITHUB_STEP_SUMMARY"
      - name: rk syntax
        if: "!startsWith(matrix.cc, 'rucc')"
        run: |
          target/release/rk syntax --build "$OUT" --cc rucc > "$OUT/syntax.md" || true
          cat "$OUT/syntax.md" >> "$GITHUB_STEP_SUMMARY"
      - name: the kernel-pp corpus
        if: matrix.cc == needs.era.outputs.gcc && inputs.reference == 'era' && matrix.row == 'X64' && matrix.config == 'defconfig'
        run: |
          git clone -q https://github.com/tamnd/rucc-compat "$RUNNER_TEMP/rucc-compat"
          cd "$RUNNER_TEMP/rucc-compat"
          cargo build --release -p rucc-compat
          RUCC_COMPAT_KERNEL="$OUT" target/release/rucc-compat run kernel-pp --rucc "$(command -v rucc)" \
            --cc "$(command -v "$CC")" --report || true
          cp results/kernel-pp.md "$OUT/kernel-pp.md" || true
          cat "$OUT/kernel-pp.md" >> "$GITHUB_STEP_SUMMARY" || true
        env:
          CC: ${{ matrix.cc }}
      # A defconfig or distribution config that linked is booted under QEMU with the smoke checks of rk-init, so a row
      # whose kernel builds is also seen to run. The arm64 runner has no KVM, so its boot is TCG
      # and is given longer.
      - name: rk boot
        if: matrix.config != 'allmodconfig'
        continue-on-error: true
        run: |
          sudo apt-get install -qy --no-install-recommends busybox-static \
            "$([ "$ROW" = A64 ] && echo qemu-system-arm || echo qemu-system-x86)"
          # An i386 kernel cannot run the runner's own 64 bit busybox, so X32 gets the i386 one.
          busybox=()
          if [ "$ROW" = X32 ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update -q
            (cd "$RUNNER_TEMP" && apt-get download busybox-static:i386 \
              && dpkg-deb -x busybox-static_*_i386.deb busybox-i386)
            busybox=(--busybox "$RUNNER_TEMP/busybox-i386/bin/busybox")
          fi
          target/release/rk boot --build "$OUT" --row "$ROW" --timeout 1500 "${busybox[@]}"
        env:
          ROW: ${{ matrix.row }}
      # The object audits run here, since the objects do not go to the compare job. rk vec-audit
      # saves the counts it compares there, and rk modules-audit reads the modules of this build.
      - name: rk object audits
        if: always()
        run: |
          target/release/rk sections-diff --reference "$OUT" --save "$OUT/sections.json" > /dev/null || true
          target/release/rk vec-audit --build "$OUT" --save "$OUT/vec.json" > "$OUT/vec-audit.md" || true
          target/release/rk modules-audit --build "$OUT" > "$OUT/modules-audit.md" || true
          cat "$OUT/vec-audit.md" "$OUT/modules-audit.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: keep the record
        if: always()
        run: |
          mkdir -p record
          cd "$OUT"
          cp build.json summary.md config.log fragment.log build.log demands.md asm-inventory.md syntax.md kernel-pp.md \
            boot.json boot.log .config sections.json vec.json vec-audit.md modules-audit.md Module.symvers System.map \
            "$GITHUB_WORKSPACE/record/" 2>/dev/null || true
          if [ -f compile.jsonl ]; then gzip -c compile.jsonl > "$GITHUB_WORKSPACE/record/compile.jsonl.gz"; fi
          find . -path ./rk-bin -prune -o -name '.*.o.cmd' -print | tar -czf "$GITHUB_WORKSPACE/record/cmd.tar.gz" -T -
          # The image, so a boot that fails here can be tried again elsewhere.
          if [ "$CONFIG" != allmodconfig ]; then
            cp arch/*/boot/Image arch/*/boot/bzImage "$GITHUB_WORKSPACE/record/" 2>/dev/null || true
          fi
          # The paths a manual run names, so that an object the diff reports can be read elsewhere.
          if [ -n "$KEEP" ]; then
            read -ra keep <<< "$KEEP"
            tar -czf "$GITHUB_WORKSPACE/record/keep.tar.gz" --ignore-failed-read "${keep[@]}" || true
          fi
        env:
          CONFIG: ${{ matrix.config }}
          KEEP: ${{ inputs.keep }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: census-${{ inputs.version }}-${{ matrix.row }}-${{ matrix.config }}-${{ matrix.cc }}
          path: record
          include-hidden-files: true
          retention-days: 30

  compare:
    name: ${{ inputs.version }} ${{ matrix.row }} ${{ matrix.config }}, ${{ needs.era.outputs.other }} against ${{ needs.era.outputs.ref }}
    needs: [era, census]
    if: always()
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.rows) }}
        config: ${{ fromJSON(inputs.configs) }}
    env:
      REF: records/census-${{ inputs.version }}-${{ matrix.row }}-${{ matrix.config }}-${{ needs.era.outputs.ref }}
      OTHER: records/census-${{ inputs.version }}-${{ matrix.row }}-${{ matrix.config }}-${{ needs.era.outputs.other }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: census-${{ inputs.version }}-${{ matrix.row }}-${{ matrix.config }}-*
          path: records
      - name: build rk
        run: |
          cargo build --release -p rk
          for r in records/*; do
            if [ -f "$r/compile.jsonl.gz" ]; then gunzip -f "$r/compile.jsonl.gz"; fi
            if [ -f "$r/cmd.tar.gz" ]; then tar -xzf "$r/cmd.tar.gz" -C "$r"; fi
          done
      - name: rk config-diff
        run: target/release/rk config-diff --reference "$REF" --other "$OTHER" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk probes
        if: always()
        run: target/release/rk probes --reference "$REF" --other "$OTHER" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk flags-diff
        if: always()
        run: target/release/rk flags-diff --reference "$REF" --other "$OTHER" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk sections-diff
        if: always()
        run: |
          target/release/rk sections-diff --reference "$REF"/sections.json \
            --other "$OTHER"/sections.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk symvers-diff
        if: always()
        run: target/release/rk symvers-diff --reference "$REF" --other "$OTHER" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk vec-audit
        if: always()
        run: |
          target/release/rk vec-audit --build "$OTHER"/vec.json \
            --reference "$REF"/vec.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk objtool-report
        if: always()
        run: target/release/rk objtool-report --reference "$REF" --other "$OTHER" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: rk speed
        if: always()
        run: target/release/rk speed --reference "$REF" --other "$OTHER" | tee -a "$GITHUB_STEP_SUMMARY"

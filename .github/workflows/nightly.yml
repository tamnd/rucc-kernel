# The nightly: every pin in the current set on X64, built with the GCC of its era and with rucc from
# tinyconfig and the test fragment, and graded by rk test on boot, smoke, KUnit, the selftests and
# LTP, which are built with gcc-14 and with rucc.
#
# The era's GCC is the one personas.toml names, gcc-14 for 7.2 and gcc-12 for 6.12 and 6.1, as in
# kernel.yml and the census, since that is the release rucc claims to be for the version. With
# gcc-14 as the reference for 6.12 the two .config files differ in every probe that asks for a GCC
# 13 or 14 feature, and one of those, CC_HAS_SANE_FUNCTION_ALIGNMENT, decides whether `__cold` is
# an attribute. genksyms sees it in the declaration of `_printk`, `_dev_err` and the rest, so their
# CRCs differ and no module of one build loads into the other kernel.
#
# Both builds of a version run in one job, because rk test and rk mixed need both build directories
# and the objects are too big to move between jobs. When the rucc kernel fails a unit the reference
# passes, rk mixed looks for the object and the pass behind the first such unit, within the time
# left. rk cross-modules then loads each build's modules into the other kernel, and does not turn
# the night red until K5. A red nightly is the point: the K3 exit criterion is three green nights in a row.
#
# The rucc binary is the pinned release, checked against its hash, as in kernel.yml. A manual run
# can name a branch or commit of tamnd/rucc instead.
#
# A manual run can also name the row, the versions and the QEMU CPU. A64 runs on the arm runner,
# which has no KVM, so its boots are TCG and are given longer, and its rucc is built from source,
# from the pinned release's tag when no branch or commit is named, since the release tarball is
# the x86_64 one. X32 pins no selftests or LTP in rows.toml, so its nights build neither and are
# graded on boot, smoke and KUnit, which is what the K4 exit criterion asks for. A manual run with
# userland set to no builds neither on any row, which keeps an A64 night on TCG inside the job's time.
#
# On A64 rk test and rk cross-modules run four boots at once rather than one per two CPUs, since
# most suites keep one of a guest's two CPUs busy and TCG leaves an idle one asleep. A distro config
# still has more to boot than one job has time for, so a manual run can name the kinds rk test
# grades and split a night in two, one run with kunit, which rk cross-modules needs as well, and one
# with the selftests and LTP.

name: nightly

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      rucc:
        description: A branch or commit of tamnd/rucc to build instead of the pinned release
        required: false
        default: ""
      config:
        description: The configuration target
        required: false
        default: tinyconfig
      row:
        description: The row, X64, A64 or X32
        required: false
        default: X64
      versions:
        description: The versions as a JSON list, or empty for the current set
        required: false
        default: ""
      cpu:
        description: The QEMU CPU to boot on, or empty for the row's own
        required: false
        default: ""
      userland:
        description: Whether to build and run the selftests and LTP, yes or no
        required: false
        default: "yes"
      kinds:
        description: The kinds rk test grades, as boot,smoke,kunit,kselftest,ltp, or empty for every one there is
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RK_CACHE: ${{ github.workspace }}/../rk-cache
  RUCC_VERSION: v0.30.12
  RUCC_SHA256: 2d651235d9bd5ec27e8f3e0576161a5fe0e31c0b158ecc8ffcb6d587a8ae54e2
  CONFIG: ${{ inputs.config || 'tinyconfig' }}
  ROW: ${{ inputs.row || 'X64' }}
  CPU: ${{ inputs.cpu }}
  KINDS: ${{ inputs.kinds }}
  JOBS: ${{ inputs.row == 'A64' && '4' || '' }}
  TARGETS: ${{ inputs.row == 'A64' && 'Image modules' || 'bzImage modules' }}

jobs:
  set:
    name: the current set
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.pins.outputs.versions }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: pins
        name: read pins.toml
        shell: python3 {0}
        run: |
          import json, os, tomllib
          with open("pins.toml", "rb") as f:
              pins = tomllib.load(f)["pin"]
          versions = [p["version"] for p in pins if "current" in p.get("sets", [])]
          if os.environ["ASKED"]:
              versions = json.loads(os.environ["ASKED"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"versions={json.dumps(versions)}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"The versions are {', '.join(versions)}.\n")
        env:
          ASKED: ${{ inputs.versions }}

  test:
    name: ${{ matrix.version }} ${{ inputs.row || 'X64' }}
    needs: set
    runs-on: ${{ inputs.row == 'A64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.row == 'A64' && 355 || 300 }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.set.outputs.versions) }}
    steps:
      # The job is cancelled at its limit with nothing kept, so rk test and rk cross-modules stop
      # on their own before it. rk test gets until 45 minutes before the end, rk cross-modules
      # until 15 minutes before, and the checks and the record after them still run.
      - name: the deadline
        run: echo "DEADLINE=$(( $(date +%s) + (LIMIT - 15) * 60 ))" >> "$GITHUB_ENV"
        env:
          LIMIT: ${{ inputs.row == 'A64' && 355 || 300 }}
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: the reference for the version
        run: cargo run -q --release -p rk -- personas --for "$VERSION" | grep '^gcc=' | sed 's/^gcc=/GCC=/' >> "$GITHUB_ENV"
        env:
          VERSION: ${{ matrix.version }}
      - name: kernel build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends "$GCC" gcc-14 flex bison bc libelf-dev \
            libssl-dev cpio "$QEMU" busybox-static libcap-dev libnuma-dev rsync libaio-dev \
            libacl1-dev libkeyutils-dev dwarves
        env:
          QEMU: ${{ inputs.row == 'A64' && 'qemu-system-arm' || 'qemu-system-x86' }}
      - name: let the runner user open /dev/kvm
        if: inputs.row != 'A64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: rucc ${{ inputs.rucc || env.RUCC_VERSION }} from source
        if: inputs.rucc != '' || inputs.row == 'A64'
        run: |
          git clone -q https://github.com/tamnd/rucc "$RUNNER_TEMP/rucc-src"
          git -C "$RUNNER_TEMP/rucc-src" checkout -q "$REF"
          cargo build --release --manifest-path "$RUNNER_TEMP/rucc-src/Cargo.toml" -p rucc
          echo "$RUNNER_TEMP/rucc-src/target/release" >> "$GITHUB_PATH"
          echo "rucc built from $(git -C "$RUNNER_TEMP/rucc-src" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
        env:
          REF: ${{ inputs.rucc || env.RUCC_VERSION }}
      - name: rucc ${{ env.RUCC_VERSION }}
        if: inputs.rucc == '' && inputs.row != 'A64'
        run: |
          name="rucc-$RUCC_VERSION-x86_64-unknown-linux-gnu"
          gh release download "$RUCC_VERSION" -R tamnd/rucc -p "$name.tar.gz" -D "$RUNNER_TEMP"
          echo "$RUCC_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build rk
        run: cargo build --release --workspace
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.RK_CACHE }}/archives
          key: kernel-archives-${{ matrix.version }}-${{ hashFiles('pins.toml') }}
          restore-keys: kernel-archives-${{ matrix.version }}-
      - name: rk build with the era's GCC
        run: |
          target/release/rk build ${{ matrix.version }} --row "$ROW" --config "$CONFIG" --fragment test \
            --cc "$GCC" --targets "$TARGETS" --out "$RUNNER_TEMP/gcc" --stack-usage
      - name: rk build with rucc
        continue-on-error: true
        run: |
          target/release/rk build ${{ matrix.version }} --row "$ROW" --config "$CONFIG" --fragment test \
            --cc rucc --targets "$TARGETS" --out "$RUNNER_TEMP/rucc" --keep-going --stack-usage
      - name: rk selftests with gcc-14
        if: inputs.row != 'X32' && inputs.userland != 'no'
        run: |
          target/release/rk selftests --build "$RUNNER_TEMP/gcc" --cc gcc-14 \
            --out "$RUNNER_TEMP/selftests-gcc"
      - name: rk selftests with rucc
        if: inputs.row != 'X32' && inputs.userland != 'no'
        continue-on-error: true
        run: |
          target/release/rk selftests --build "$RUNNER_TEMP/gcc" --cc rucc \
            --out "$RUNNER_TEMP/selftests-rucc"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.RK_CACHE }}/ltp
          key: ltp-${{ runner.arch }}-${{ hashFiles('ltp.toml') }}
      - name: rk ltp with gcc-14
        if: inputs.row != 'X32' && inputs.userland != 'no'
        run: |
          target/release/rk ltp --build "$RUNNER_TEMP/gcc" --cc gcc-14 --out "$RUNNER_TEMP/ltp-gcc"
      - name: rk ltp with rucc
        if: inputs.row != 'X32' && inputs.userland != 'no'
        continue-on-error: true
        run: |
          target/release/rk ltp --build "$RUNNER_TEMP/gcc" --cc rucc --out "$RUNNER_TEMP/ltp-rucc"
      - name: rk test
        id: test
        run: |
          boot=(--timeout "$TIMEOUT")
          if [ -n "$CPU" ]; then boot+=(--cpu "$CPU"); fi
          if [ -n "$JOBS" ]; then boot+=(--jobs "$JOBS"); fi
          kinds=boot,smoke,kunit
          userland=()
          if [ -f "$RUNNER_TEMP/selftests-gcc/selftests.json" ]; then
            kinds+=,kselftest
            userland+=(--selftests "$RUNNER_TEMP/selftests-gcc")
          fi
          if [ -f "$RUNNER_TEMP/ltp-gcc/ltp.json" ]; then
            kinds+=,ltp
            userland+=(--ltp "$RUNNER_TEMP/ltp-gcc")
          fi
          rucc_userland=()
          if [ -f "$RUNNER_TEMP/selftests-rucc/selftests.json" ]; then
            rucc_userland+=(--rucc-selftests "$RUNNER_TEMP/selftests-rucc")
          fi
          if [ -f "$RUNNER_TEMP/ltp-rucc/ltp.json" ]; then
            rucc_userland+=(--rucc-ltp "$RUNNER_TEMP/ltp-rucc")
          fi
          if [ -n "$KINDS" ]; then kinds=$KINDS; fi
          left=$(( DEADLINE - 30 * 60 - $(date +%s) ))
          timeout "$(( left > 60 ? left : 60 ))" \
            target/release/rk test --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            --kinds "$kinds" "${userland[@]}" "${rucc_userland[@]}" "${boot[@]}" --out "$RUNNER_TEMP/test"
        env:
          TIMEOUT: ${{ inputs.row == 'A64' && 2400 || 600 }}
      - name: rk cross-modules
        if: always() && steps.test.outcome != 'skipped' && (inputs.kinds == '' || contains(inputs.kinds, 'kunit'))
        continue-on-error: true
        run: |
          boot=(--timeout "$TIMEOUT")
          if [ -n "$CPU" ]; then boot+=(--cpu "$CPU"); fi
          if [ -n "$JOBS" ]; then boot+=(--jobs "$JOBS"); fi
          left=$(( DEADLINE - $(date +%s) ))
          timeout "$(( left > 60 ? left : 60 ))" \
            target/release/rk cross-modules --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            "${boot[@]}" --out "$RUNNER_TEMP/cross"
        env:
          TIMEOUT: ${{ inputs.row == 'A64' && 2400 || 600 }}
      - name: rk objtool-report
        if: always() && steps.test.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          if target/release/rk objtool-report --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            > "$RUNNER_TEMP/checks/objtool.md"; then verdict=clean; else verdict=findings; fi
          echo "$verdict" > "$RUNNER_TEMP/checks/objtool.status"
          cat "$RUNNER_TEMP/checks/objtool.md"
      - name: rk frames
        if: always() && steps.test.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          if target/release/rk frames --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            > "$RUNNER_TEMP/checks/frames.md"; then verdict=clean; else verdict=findings; fi
          echo "$verdict" > "$RUNNER_TEMP/checks/frames.status"
          cat "$RUNNER_TEMP/checks/frames.md"
      - name: rk btf
        if: always() && steps.test.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          rc=0
          target/release/rk btf --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            > "$RUNNER_TEMP/checks/btf.md" || rc=$?
          case $rc in 0) verdict=clean ;; 1) verdict=findings ;; *) verdict="not run" ;; esac
          echo "$verdict" > "$RUNNER_TEMP/checks/btf.status"
          cat "$RUNNER_TEMP/checks/btf.md"
      - name: keep the record
        if: always()
        run: |
          mkdir -p record/gcc record/rucc record/test record/cross record/selftests record/ltp
          for side in gcc rucc; do
            cp "$RUNNER_TEMP/$side"/{build.json,summary.md,build.log,.config} "record/$side/" 2>/dev/null || true
            # A link that stopped at the kallsyms check leaves no vmlinux, and the maps of each pass
            # are what says which symbols moved.
            if [ ! -f "$RUNNER_TEMP/$side/vmlinux" ]; then
              for map in System.map .tmp_vmlinux1.syms .tmp_vmlinux2.syms .tmp_vmlinux3.syms; do
                if [ -f "$RUNNER_TEMP/$side/$map" ]; then
                  gzip -c "$RUNNER_TEMP/$side/$map" > "record/$side/$map.gz"
                fi
              done
            fi
            # The BTF of each vmlinux, so that a type rk btf lists can be looked up in the artifact.
            if [ -f "$RUNNER_TEMP/$side/vmlinux" ]; then
              python3 - "$RUNNER_TEMP/$side/vmlinux" "record/$side/vmlinux.btf" <<'EOF' || true
          import mmap, struct, sys
          with open(sys.argv[1], 'rb') as f:
              d = mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ)
          shoff, = struct.unpack_from('<Q', d, 0x28)
          size, count, names = struct.unpack_from('<HHH', d, 0x3a)
          def section(i):
              return struct.unpack_from('<IIQQQQIIQQ', d, shoff + i * size)
          base = section(names)[4]
          for i in range(count):
              s = section(i)
              if d[base + s[0]:d.find(b'\0', base + s[0])] == b'.BTF':
                  open(sys.argv[2], 'wb').write(d[s[4]:s[4] + s[5]])
          EOF
              gzip -f "record/$side/vmlinux.btf" 2>/dev/null || true
            fi
          done
          cp -r "$RUNNER_TEMP/test/." record/test/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/cross/." record/cross/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/checks" record/ 2>/dev/null || true
          for side in gcc rucc; do
            mkdir -p "record/selftests/$side"
            cp -r "$RUNNER_TEMP/selftests-$side"/{selftests.json,logs} "record/selftests/$side/" 2>/dev/null || true
            mkdir -p "record/ltp/$side"
            cp -r "$RUNNER_TEMP/ltp-$side"/{ltp.json,logs} "record/ltp/$side/" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: nightly-${{ matrix.version }}-${{ inputs.row || 'X64' }}
          path: record
          include-hidden-files: true
          retention-days: 30
          overwrite: true
      - name: rk mixed on the first failed unit
        id: mixed
        if: failure() && steps.test.outcome == 'failure'
        timeout-minutes: 180
        run: |
          unit=$(python3 -c 'import json, sys; t = json.load(open(sys.argv[1])); print(next((u["name"] for u in t["units"] if u["graded"] and not u["passed"] and u.get("attribution", "kernel") == "kernel"), ""))' "$RUNNER_TEMP/test/test.json")
          if [ -z "$unit" ]; then echo "no kernel failure to bisect"; exit 0; fi
          boot=()
          if [ -n "$CPU" ]; then boot+=(--cpu "$CPU"); fi
          if [ -d "$RUNNER_TEMP/selftests-gcc" ]; then boot+=(--selftests "$RUNNER_TEMP/selftests-gcc"); fi
          if [ -d "$RUNNER_TEMP/ltp-gcc" ]; then boot+=(--ltp "$RUNNER_TEMP/ltp-gcc"); fi
          left=$(( DEADLINE - $(date +%s) ))
          if [ "$left" -lt 600 ]; then echo "no time left to bisect $unit"; exit 0; fi
          timeout "$left" target/release/rk mixed "${boot[@]}" --reference "$RUNNER_TEMP/gcc" --other "$RUNNER_TEMP/rucc" \
            --unit "$unit" --out "$RUNNER_TEMP/mixed"
      - name: add rk mixed to the record
        if: always() && steps.mixed.outcome != 'skipped'
        run: |
          mkdir -p record/mixed
          cp "$RUNNER_TEMP"/mixed/{mixed.json,summary.md,relink.jsonl} "$RUNNER_TEMP"/mixed/*.log record/mixed/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/mixed/fuel" record/mixed/ 2>/dev/null || true
          find record/mixed/fuel -name '*.o' -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.mixed.outcome != 'skipped'
        with:
          name: nightly-${{ matrix.version }}-${{ inputs.row || 'X64' }}
          path: record
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  report:
    name: the report
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: nightly-*
          path: records
      - name: headline
        shell: python3 {0}
        run: |
          import json, os, pathlib
          row = os.environ["ROW"]
          lines = [f"### nightly, {row}", "", "| version | graded | failed | splats | verdict | objtool | frames | btf |", "|---|---|---|---|---|---|---|---|"]
          for record in sorted(pathlib.Path("records").iterdir()):
              version = record.name.removeprefix("nightly-").removesuffix(f"-{row}")
              path = record / "test" / "test.json"
              checks = []
              for name in ("objtool", "frames", "btf"):
                  status = record / "checks" / f"{name}.status"
                  checks.append(status.read_text().strip() if status.exists() else "not run")
              if not path.exists():
                  lines.append(f"| {version} | | | | not run | {checks[0]} | {checks[1]} | {checks[2]} |")
                  continue
              t = json.loads(path.read_text())
              graded = [u for u in t["units"] if u["graded"]]
              failed = [u["name"] for u in graded if not u["passed"]]
              splats = len(t["splats"].get("other-only", []))
              verdict = "green" if not failed and not splats else "red"
              lines.append(f"| {version} | {len(graded)} | {len(failed)} | {splats} | {verdict} | {checks[0]} | {checks[1]} | {checks[2]} |")
          for record in sorted(pathlib.Path("records").iterdir()):
              summary = record / "mixed" / "summary.md"
              if summary.exists():
                  lines += ["", f"#### {record.name}", "", summary.read_text()]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")

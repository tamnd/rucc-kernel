# The eras of section 04.2 of the plan: which GCC each range of kernel versions was built with,
# and which GCC rucc claims to be when it builds them.
#
# `from` and `to` are the first and last kernel version of the era, inclusive, and `to` is left out
# for the era that is still open. `gnuc` is passed to rucc as -fgnuc-version, and `gnu-as` will be
# passed as -fgnu-as-version once rucc has it (K1). The reference is the GCC and binutils the
# kernel of that era was built with, and the container is where they live.

[[era]]
id = "E0"
from = "1.0"
to = "1.2.13"
gnuc = "2.7.2"
gnu-as = "2.5"
reference = { gcc = "2.7.2.3", binutils = "2.5", container = "rk-era-etch" }
std = "gnu89"
notes = "the museum; a.out objects before 1.2, -traditional for .S"

[[era]]

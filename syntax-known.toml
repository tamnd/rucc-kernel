# Units of the reference build that rk syntax expects rucc to fail on, each with the issue that
# fixes it.
#
# rk syntax replays every unit the reference compiled through rucc's front end, and fails when a
# unit fails that is not listed here. A trailing star in a unit matches every unit with that
# prefix. When a listed unit passes, the report says so, and the entry should come off.
#
# [[known]]
# unit = "arch/x86/entry/entry_64.S"
# issue = "tamnd/rucc#2270"

# gcc's arm_neon.h, which the kernel reaches through -isystem of gcc's include directory. rucc's
# own build reads rucc's header and compiles all of these.
[[known]]
unit = "lib/crc/crc64-neon.c"
issue = "tamnd/rucc#3861"

[[known]]
unit = "crypto/aegis128-neon-inner.c"
issue = "tamnd/rucc#3861"

[[known]]
unit = "lib/raid/raid6/arm/neon*"
issue = "tamnd/rucc#3861"

[[known]]
unit = "lib/raid/raid6/arm/recov_neon_inner.c"
issue = "tamnd/rucc#3861"

[[known]]
unit = "lib/raid/xor/arm64/xor-eor3.c"
issue = "tamnd/rucc#3861"

[[known]]
unit = "lib/raid/xor/xor-neon.c"
issue = "tamnd/rucc#3861"
